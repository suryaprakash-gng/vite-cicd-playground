name: Deploy

# Downloads the pre-built versioned artifact (site-vX.Y.Z) and deploys it.
# NO rebuild from source — the artifact IS the source of truth.
#
# Usage:
#   Automatic: called by release.yml after build-release succeeds.
#   Rollback:  run manually from the Actions tab → pick any tag → deploys that exact build.
#   Hotfix:    after merging hotfix PR to main, release-please creates a new tag → normal flow.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag:
        type: string # vX.Y.Z tag whose artifact to deploy
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - dev
          - uat
          - production
        required: true
      tag:
        description: Release tag or artifact version to deploy (e.g. v1.4.0 or dev-pr-1)
        type: string
        required: true

permissions:
  contents: read
  id-token: write # Required for AWS OIDC authentication (AssumeRoleWithWebIdentity)

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # never interrupt a running deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the artifact built and uploaded by build-release (or dev CI).
      - name: Download versioned artifact
        uses: actions/download-artifact@v4
        with:
          name: site-${{ inputs.tag }}
          path: dist

      # Keyless AWS Authentication using GitHub Actions OIDC Provider
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-1' }}
          audience: sts.amazonaws.com

      # Deploy the pre-built static bundle directly to Amazon S3 — ZERO rebuild from source.
      - name: Deploy to Amazon S3
        id: s3-deploy
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID || secrets.CF_DISTRIBUTION_ID }}
        run: |
          if [ -z "$S3_BUCKET" ]; then
            echo "::error::S3_BUCKET variable or secret is not set for environment '${{ inputs.environment }}'."
            echo "Please set S3_BUCKET in GitHub Environment secrets/variables."
            exit 1
          fi

          echo "🚀 Deploying pre-built artifact to s3://$S3_BUCKET..."

          # 1. Fingerprinted/hashed assets: immutable cache for 1 year (31536000s)
          if [ -d "dist/assets" ]; then
            echo "📦 Syncing static assets with 1-year immutable caching..."
            aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
              --cache-control "public,max-age=31536000,immutable"
          fi

          # 2. HTML, manifest, & entrypoints: revalidate immediately (no-cache)
          echo "📄 Syncing HTML, icons, and root assets with no-cache..."
          aws s3 sync dist "s3://$S3_BUCKET" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

          # 3. Optional CloudFront distribution cache purge
          if [ -n "$CF_DISTRIBUTION_ID" ]; then
            echo "⚡ Creating CloudFront invalidation for distribution: $CF_DISTRIBUTION_ID..."
            INVALIDATION_ID=$(aws cloudfront create-invalidation \
              --distribution-id "$CF_DISTRIBUTION_ID" \
              --paths "/*" \
              --query "Invalidation.Id" \
              --output text)
            echo "CF_INVALIDATION_ID=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
            echo "CloudFront Invalidation created: $INVALIDATION_ID"
          fi

      - name: Deployment Summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ inputs.tag }}
          S3_BUCKET: ${{ vars.S3_BUCKET || secrets.S3_BUCKET }}
          CF_DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID || secrets.CF_DISTRIBUTION_ID }}
          CF_INVALIDATION_ID: ${{ steps.s3-deploy.outputs.CF_INVALIDATION_ID }}
        run: |
          {
            echo "## 🚀 Deployed \`$TAG\` → Amazon S3 (\`$ENVIRONMENT\`)"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Tag / Ref** | \`$TAG\` |"
            echo "| **Environment** | \`$ENVIRONMENT\` |"
            echo "| **S3 Bucket** | \`s3://$S3_BUCKET\` |"
            if [ -n "$CF_DISTRIBUTION_ID" ]; then
              echo "| **CloudFront Dist ID** | \`$CF_DISTRIBUTION_ID\` |"
              echo "| **Invalidation ID** | \`$CF_INVALIDATION_ID\` |"
            fi
            echo
            echo "Deployed from pre-built artifact **\`site-$TAG\`** without recompiling source code."
          } >> "$GITHUB_STEP_SUMMARY"
