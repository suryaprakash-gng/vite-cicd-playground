name: Deploy

# Downloads the pre-built versioned artifact (site-vX.Y.Z) and deploys it.
# NO rebuild from source — the artifact IS the source of truth.
#
# Usage:
#   Automatic: called by release.yml after build-release succeeds.
#   Rollback:  run manually from the Actions tab → pick any tag → deploys that exact build.
#   Hotfix:    after merging hotfix PR to main, release-please creates a new tag → normal flow.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag:
        type: string          # vX.Y.Z tag whose artifact to deploy
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options: [production]
        required: true
      tag:
        description: Release tag to deploy or roll back to (e.g. v1.4.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false   # never interrupt a running deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    steps:
      # Download the artifact built and uploaded by build-release (or a prior release).
      - name: Download versioned artifact
        uses: actions/download-artifact@v4
        with:
          name: site-${{ inputs.tag }}
          path: dist

      # ── SIMULATED DEPLOY ─────────────────────────────────────────────────
      # Replace the block below with your real deploy step (Vercel, S3, etc.).
      # The artifact in dist/ is already built — no install/build needed.
      # ─────────────────────────────────────────────────────────────────────
      - name: Simulate deploy (replace with real step)
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          echo "Deploying artifact for tag $TAG to $ENVIRONMENT"
          echo "Files in dist/:"
          find dist -type f | sort

          {
            echo "## Deployed \`$TAG\` → \`$ENVIRONMENT\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag         | \`$TAG\` |"
            echo "| Environment | \`$ENVIRONMENT\` |"
            echo "| URL         | ${{ vars.APP_URL }} |"
            echo
            echo "Artifact contents:"
            echo '```'
            find dist -type f -exec ls -lh {} \; | awk '{print $5"\t"$9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
