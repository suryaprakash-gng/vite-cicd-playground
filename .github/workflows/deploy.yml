name: Deploy

# Downloads the pre-built versioned artifact (site-vX.Y.Z) and deploys it.
# NO rebuild from source — the artifact IS the source of truth.
#
# Usage:
#   Automatic: called by release.yml after build-release succeeds.
#   Rollback:  run manually from the Actions tab → pick any tag → deploys that exact build.
#   Hotfix:    after merging hotfix PR to main, release-please creates a new tag → normal flow.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag:
        type: string # vX.Y.Z tag whose artifact to deploy
        required: true
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - dev
          - uat
          - production
        required: true
      tag:
        description: Release tag or artifact version to deploy (e.g. v1.4.0 or dev-pr-1)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false # never interrupt a running deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.vercel.outputs.preview-url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Download the artifact built and uploaded by build-release (or a prior release).
      - name: Download versioned artifact
        uses: actions/download-artifact@v4
        with:
          name: site-${{ inputs.tag }}
          path: dist

      # Vercel's --prebuilt expects:
      #   .vercel/project.json   → project linking metadata
      #   .vercel/output/static/ → compiled static assets
      #   .vercel/output/config.json → routing rules (Build Output API v3)
      - name: Prepare Vercel prebuilt output
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel/output/static

          # Write project.json so Vercel CLI can resolve the project without prompting
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" \
            > .vercel/project.json

          # Copy the downloaded artifact into the Build Output API v3 static directory
          cp -r dist/. .vercel/output/static/

          # SPA rewrite: any unmatched path serves index.html for client-side routing
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      # Deploy the pre-built artifact directly to Vercel — NO rebuild from source.
      - name: Deploy pre-built artifact to Vercel
        id: vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-project-name: vite-cicd-playground
          scope: ${{ secrets.VERCEL_ORG_ID }}
          vercel-version: latest
          vercel-args: ${{ inputs.environment == 'production' && '--prod --prebuilt' || '--prebuilt' }}
          working-directory: .

      - name: Deployment Summary
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          TAG: ${{ inputs.tag }}
          DEPLOY_URL: ${{ steps.vercel.outputs.preview-url }}
        run: |
          {
            echo "## 🚀 Deployed \`$TAG\` → \`$ENVIRONMENT\`"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Tag / Ref** | \`$TAG\` |"
            echo "| **Environment** | \`$ENVIRONMENT\` |"
            echo "| **URL** | [$DEPLOY_URL]($DEPLOY_URL) |"
            echo
            echo "Deployed from pre-built artifact **\`site-$TAG\`** without recompiling source code."
          } >> "$GITHUB_STEP_SUMMARY"
